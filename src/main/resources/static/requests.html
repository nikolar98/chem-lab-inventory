<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chem Lab Inventory - Zahtevi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #203a43;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #cfd8dc;
            margin-bottom: 35px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .sidebar-nav a {
            display: block;
            text-decoration: none;
            color: #eaf4f7;
            padding: 13px 16px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.25s;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: rgba(0, 188, 212, 0.25);
            color: white;
        }

        .logout {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 22px;
        }

        .logout button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .logout button:hover {
            background: rgba(255,255,255,0.22);
        }

        .content {
            margin-left: 260px;
            width: calc(100% - 260px);
        }

        .topbar {
            background: white;
            height: 80px;
            border-bottom: 1px solid #e5e7eb;
        }

        .page-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        .table th {
            font-weight: 600;
            vertical-align: middle;
        }

        .table td {
            vertical-align: middle;
        }

        .table td:nth-child(4) {
            max-width: 300px;
            color: #6c757d;
            font-size: 0.95rem;
        }

        .admin-only {
            display: none;
        }
    </style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        Hemijska<br>laboratorija
    </div>

    <div class="subtitle">
        Sistem za evidenciju hemikalija i zaliha
    </div>

    <nav class="sidebar-nav">
        <a href="/home.html">Početna</a>
        <a href="/chemicals.html">Hemikalije</a>
        <a href="/potrosnja.html"> Potrošnja </a>
        <a href="/users.html" class="admin-only"> Korisnici </a>
        <a href="/izvestaji.html"> Izveštaji </a>
        <a href="/alerts.html"> Upozorenja </a>
        <a href="/requests.html" class="admin-only">Zahtevi</a>
    </nav>

    <form class="logout" action="/logout" method="post">
        <button type="submit">Odjava</button>
    </form>

</aside>

<div class="content">

    <div class="topbar d-flex align-items-center justify-content-between px-4">

        <h4 class="mb-0">Zahtevi</h4>

        <div class="text-end">
            <strong>Dobrodošli</strong><br>
            <small id="userEmail">admin@test.com</small>
        </div>

    </div>

    <div class="container-fluid p-4">

        <div class="page-card">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2>Lista zahteva</h2>

                    <p class="text-muted">
                        Pregled svih zahteva koji čekaju odobrenje.
                    </p>
                </div>

            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                    <tr>
                        <th>Tip zahteva</th>
                        <th>Korisnik</th>
                        <th>Vreme slanja</th>
                        <th>Komentar / Napomena</th>
                        <th>Akcije</th>
                    </tr>
                    </thead>

                    <tbody id="requestsTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>
    const email = sessionStorage.getItem("email");

    if (email) {
        document.getElementById("userEmail").textContent = email;
    }

    fetch("/api/requests")
        .then(response => response.json())
        .then(requests => {
            const tbody = document.getElementById("requestsTableBody");

            tbody.innerHTML = "";

            if (requests.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-muted">
                            Trenutno nema zahteva za prikaz.
                        </td>
                    </tr>
                `;
                return;
            }

            requests.forEach(request => {
                const createdAt = request.createdAt
                    ? request.createdAt.replace("T", " ").substring(0, 16)
                    : "—";

                tbody.innerHTML += `
                    <tr>
                        <td>${formatRequestType(request.type)}</td>

                        <td>
                            ${request.fullName || "—"}<br>
                            <small class="text-muted">${request.email || ""}</small>
                        </td>

                        <td>${createdAt}</td>

                        <td>${request.comment || "—"}</td>

                        <td id="actions-${request.id}">
                            ${renderActions(request)}
                        </td>
                    </tr>
                `;
            });
        });

    function renderActions(request) {
        if (request.status === "APPROVED") {
            return `
                <div style="
                    background:#d1e7dd;
                    color:#0f5132;
                    padding:10px 14px;
                    border-radius:8px;
                    font-weight:600;
                    text-align:center;
                ">
                    Nalog je uspešno kreiran
                </div>
            `;
        }

        if (request.status === "REJECTED") {
            return `
                <div style="
                    background:#f8d7da;
                    color:#842029;
                    padding:10px 14px;
                    border-radius:8px;
                    font-weight:600;
                    text-align:center;
                ">
                    Zahtev je odbijen
                </div>
            `;
        }

        return `
            <div class="d-flex gap-2">
                <button class="btn btn-success" onclick="approveRequest(${request.id})">
                    <i class="bi bi-check-circle"></i>
                    Prihvati
                </button>

                <button class="btn btn-danger" onclick="rejectRequest(${request.id})">
                    <i class="bi bi-x-circle"></i>
                    Odbij
                </button>
            </div>
        `;
    }

    function approveRequest(id) {
        fetch(`/api/requests/${id}/approve`, {
            method: "POST"
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById(`actions-${id}`).innerHTML = `
                        <div style="
                            background:#d1e7dd;
                            color:#0f5132;
                            padding:10px 14px;
                            border-radius:8px;
                            font-weight:600;
                            text-align:center;
                        ">
                            Nalog je uspešno kreiran
                        </div>
                    `;
                } else {
                    alert("Greška prilikom kreiranja naloga.");
                }
            });
    }

    function rejectRequest(id) {
        fetch(`/api/requests/${id}/reject`, {
            method: "POST"
        })
            .then(response => {
                if (response.ok) {
                    document.getElementById(`actions-${id}`).innerHTML = `
                        <div style="
                            background:#f8d7da;
                            color:#842029;
                            padding:10px 14px;
                            border-radius:8px;
                            font-weight:600;
                            text-align:center;
                        ">
                            Zahtev je odbijen
                        </div>
                    `;
                } else {
                    alert("Greška prilikom odbijanja zahteva.");
                }
            });
    }

    function formatRequestType(type) {
        if (type === "ACCOUNT_REGISTRATION") {
            return "Registracija novog korisnika";
        }

        if (type === "ADD_CHEMICAL") {
            return "Dodavanje hemikalije";
        }

        if (type === "EDIT_CHEMICAL") {
            return "Izmena hemikalije";
        }

        if (type === "DELETE_CHEMICAL") {
            return "Brisanje hemikalije";
        }

        if (type === "UPDATE_STOCK") {
            return "Izmena količine zaliha";
        }

        return type;
    }

    fetch("/api/current-user")
        .then(response => response.json())
        .then(user => {
            document.getElementById("userEmail").textContent = user.email;

            if (user.role === "ADMIN") {
                document.querySelectorAll(".admin-only").forEach(element => {
                    element.style.display = "block";
                });
            }
        });

</script>

</body>
</html>
