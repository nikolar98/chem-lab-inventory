<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemijska laboratorija - Potrošnja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .user-info {
            font-size: 0.9rem;
            color: #5f6f7a;
            text-align: right;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .sidebar-nav a {
            display: block;
            text-decoration: none;
            color: #eaf4f7;
            padding: 13px 16px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.25s;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: rgba(0,188,212,0.25);
            color: white;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #cfd8dc;
            margin-bottom: 35px;
        }

        .sidebar-nav {
            visibility: hidden;
        }

        .sidebar-nav.ready {
            visibility: visible;
        }

        .logout {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 22px;
        }

        .logout button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .logout button:hover {
            background: rgba(255,255,255,0.22);
        }

        .content {
            margin-left: 260px;
            width: calc(100% - 260px);
        }

        .topbar {
            background: white;
            height: 75px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .page-card {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 12px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .table-container {
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        table th {
            position: sticky;
            top: 0;
            background: white;
        }

        .badge-consumption {
            background: #008b95;
        }

        .admin-only,
        .user-only {
            display: none;
        }

    </style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        Hemijska<br>laboratorija
    </div>

    <div class="subtitle">
        Sistem za evidenciju hemikalija i zaliha
    </div>

    <nav class="sidebar-nav">
        <a href="/home.html">Početna</a>
        <a href="/chemicals.html">Hemikalije</a>
        <a href="/consumptions.html" class="active"> Potrošnja </a>
        <a href="/users.html" class="admin-only"> Korisnici </a>
        <a href="/reports.html"> Izveštaji </a>
        <a href="/alerts.html"> Upozorenja </a>
        <a href="/my-requests.html" class="user-only">Moji zahtevi</a>
        <a href="/requests.html" class="admin-only">Zahtevi</a>
    </nav>

    <form class="logout" action="/logout" method="post">
        <button type="submit">Odjava</button>
    </form>

</aside>

<div class="content">

    <div class="topbar d-flex align-items-center justify-content-between px-4">

        <h4 class="mb-0">Potrošnja hemikalija</h4>

        <div class="user-info" style="display: flex; align-items: center; gap: 8px;">
            <i class="bi bi-person-circle" style="font-size: 1.4rem; color: #203a43;"></i>
            <span id="userName" style="font-weight: 600;">Učitavanje...</span>
        </div>

    </div>

    <div class="page-card">

        <h5 class="mb-3">Evidencija potrošnje</h5>

        <div class="filters">

            <input type="text" id="searchInput" class="form-control" placeholder="Pretraga...">

        </div>


        <div class="table-container" id="consumptionTable">

            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Datum</th>
                    <th>Hemikalija</th>
                    <th>Količina</th>
                    <th>Korisnik</th>
                    <th>Lokacija</th>
                    <th>Svrha</th>
                    <th>Napomena</th>
                </tr>
                </thead>
                <tbody id="consumptionTableBody">
                </tbody>
            </table>

        </div>

        <div class="mt-3 text-muted">
            Ukupno zapisa: <strong id="totalCount">0</strong>
        </div>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadCurrentUser();
        loadConsumptions();
    });

    function loadCurrentUser() {
        fetch("/api/current-user")
            .then(response => response.json())
            .then(user => {
                document.getElementById("userName").textContent = `${user.firstName} ${user.lastName}`;

                const roleName = user.role;

                if (roleName === "ADMIN" || roleName === "ROLE_ADMIN") {
                    document.querySelectorAll(".admin-only").forEach(element => {
                        element.style.setProperty("display", "block", "important");
                    });
                    document.querySelectorAll(".user-only").forEach(element => {
                        element.style.setProperty("display", "none", "important");
                    });
            } else {
                    document.querySelectorAll(".admin-only").forEach(element => {
                        element.style.setProperty("display", "none", "important");
                    });
                    document.querySelectorAll(".user-only").forEach(element => {
                        element.style.setProperty("display", "block", "important");
                    });
                }
                document.querySelector(".sidebar-nav").classList.add("ready");
            })
            .catch(error => {
                console.error("Greška pri proveri uloge korisnika:", error);
                document.querySelector(".sidebar-nav").classList.add("ready");
            });
    }

    function loadConsumptions() {
        fetch("/api/consumptions")
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById("consumptionTableBody");
                tbody.innerHTML = "";

                document.getElementById("totalCount").textContent = data.length;

                data.forEach(item => {
                    const dateObj = new Date(item.dateTaken);
                    const formattedDate = dateObj.toISOString().split('T')[0];

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>${item.chemicalName|| "/"}</td>
                    <td>
                        <span class="badge badge-consumption" title="${item.bottleStatusAfter ? 'Stanje serije: ' + item.bottleStatusAfter : ''}">
                            ${item.quantity} ${item.unit}
                        </span>
                    </td>
                    <td>${item.userFullName}</td>
                    <td>${item.locationName || "/"}</td>
                    <td>${item.purpose || "/"}</td>
                    <td>${item.note || "/"}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => console.error("Greška pri učitavanju potrošnje:", error));
    }

    const searchInput = document.getElementById("searchInput");

    searchInput.addEventListener("keyup", function () {
        const filter = this.value.toLowerCase();

        const rows = document.querySelectorAll("#consumptionTableBody tr");

        rows.forEach(row => {
            const text = row.textContent.toLowerCase();

            if (text.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    });
</script>

</body>
</html>
